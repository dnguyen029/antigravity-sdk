[project]
name = "antigravity-sdk"
version = "2.0.0"
description = "Antigravity 2.0 Python Swarm SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=. --cov-report=term-missing"
